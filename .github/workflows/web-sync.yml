name: Web sync security and build
on:
  pull_request:
  push:
    branches: [main, feat/encrypted-web-sync-v1]
permissions:
  contents: read
jobs:
  web-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run test:sql
      - run: node --test server/server.test.mjs
      - name: Verify Pages build with synthetic public configuration
        run: npm --prefix web run build:pages
        env:
          SUPABASE_URL: https://cloud.example.test
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          WEB_URL: https://notes.example.test
      # Remove synthetic deployment configuration from the portable bundle.
      - run: npm --prefix web run build
      - run: npm --prefix web audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: jnotes-web
          path: web/dist
