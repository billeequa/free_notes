name: Android build and tests
on:
  pull_request:
  push:
    branches: [main, codex/editor-fixes-and-todos, codex/version-1.3]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: bash gradlew testDebugUnitTest assembleDebug assembleRelease
      - name: Check reflective constructors in the optimized release APK
        run: python3 tools/check_release_reflection.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jnotes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jnotes-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-signing-tool
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest


  release-startup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: jnotes-unsigned-release
          path: smoke-apks
      - name: Prepare the actual release APKs with a disposable emulator-only signing key
        run: |
          curl --fail --location https://github.com/billeequa/free_notes/releases/download/v1.5.4/jnotes-27.apk --output smoke-apks/baseline-original.apk
          keytool -genkeypair -keystore smoke-apks/emulator.p12 -storepass android -keypass android -alias emulator -dname 'CN=Disposable emulator test' -keyalg RSA -keysize 2048 -validity 1
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks smoke-apks/emulator.p12 --ks-pass pass:android --out smoke-apks/baseline.apk smoke-apks/baseline-original.apk
          java -jar "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" sign --ks smoke-apks/emulator.p12 --ks-pass pass:android --out smoke-apks/candidate.apk smoke-apks/app-release-unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot the optimized APK with fresh and failed-sync state on Android 14
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: python3 tools/release_startup_smoke.py --baseline smoke-apks/baseline.apk --candidate smoke-apks/candidate.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-startup-results
          path: smoke-results
