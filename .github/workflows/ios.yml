name: iOS build and compatibility tests
on:
  push:
    branches: [main, codex/ios-v1]
    paths: ['ios/**', 'protocol/**', 'config/jnotes-service.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'protocol/**', 'config/jnotes-service.json', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate project ingredients
        run: python3 ios/scripts/validate_project.py
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iPhone Simulator without signing
        run: xcodebuild -project ios/JNotes.xcodeproj -scheme JNotes -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run compatibility and persistence tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/JNotes.xcodeproj -scheme JNotes -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios-build -resultBundlePath ios-test-results CODE_SIGNING_ALLOWED=NO test-without-building
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-and-tests
          path: |
            ios-test-results.xcresult
            ios-build/Logs/Build
