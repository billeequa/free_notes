services:
  jnotes-web:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set the public HTTPS backend URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set the public API key}
      WEB_URL: ${WEB_URL:-http://localhost:8080}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
